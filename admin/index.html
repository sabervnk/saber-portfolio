<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>مدیریت پورتفولیو</title><style>:root{color-scheme:dark;--lime:#d4ff24;--bg:#111310;--panel:#191c18;--line:#30362e;--muted:#a9b0a5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f2e9;font:15px/1.85 Tahoma,Arial,sans-serif}button,input,textarea,select{font:inherit}button,a,input,textarea{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--lime)}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:10px 16px;background:#242923;color:inherit}button:hover:not(:disabled){border-color:var(--lime)}button:disabled{opacity:.45;cursor:not-allowed}button.primary{background:var(--lime);color:#141810;font-weight:bold;border-color:transparent}a{color:var(--lime);text-decoration:none}main{max-width:1600px;margin:auto;padding:32px 36px 100px;margin-inline-start:248px}aside{position:fixed;inset:0 0 0 auto;width:248px;background:#171a16;border-left:1px solid var(--line);padding:26px 16px;display:flex;flex-direction:column;gap:24px}.brand{font-weight:bold;font-size:20px;padding:0 12px}.eyebrow{font:11px/2 Arial,sans-serif;letter-spacing:2px;color:var(--lime);direction:ltr;display:block;text-align:right}nav{display:grid;gap:6px}nav button{text-align:right;background:transparent;border-color:transparent;color:var(--muted);display:flex;gap:12px;align-items:center}nav button[aria-current=page]{background:#2c3520;border-color:#3c492b;color:var(--lime)}nav b{font-size:11px;color:inherit;direction:ltr}aside footer{margin-top:auto;padding:12px;color:var(--muted)}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:28px}h1{font-size:30px;margin:0}h2{font-size:21px;margin:0 0 18px}h3{font-size:16px;margin:0 0 12px}p{margin:8px 0;color:var(--muted)}section,article{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;margin:0 0 16px}article{background:#141713}label{display:grid;gap:7px;margin:14px 0;color:#c5cbc0;font-size:13px}input,textarea,select{width:100%;border:1px solid #3b4438;border-radius:9px;padding:12px;background:#10130f;color:#f3f2e9;min-width:0}textarea{min-height:100px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.grid>div{min-width:0}.grid>div+div{border-inline-start:1px solid var(--line);padding-inline-start:24px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bar{position:fixed;bottom:0;left:0;right:248px;background:#191c18;border-top:1px solid var(--line);padding:14px 32px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:3}#status{font-size:13px;overflow-wrap:anywhere;color:#cbd3c4}input[type=color]{height:48px;padding:5px}input[type=checkbox]{width:22px;height:22px;accent-color:var(--lime)}label:has(input[type=checkbox]){display:flex;justify-content:space-between;align-items:center;background:#111410;padding:18px;border-radius:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.stat{background:#111410;border:1px solid var(--line);padding:20px;border-radius:12px}.stat strong{display:block;font-size:30px;color:var(--lime)}.login-card{max-width:460px;margin:12vh auto 0}.login-card button{width:100%}body:not(.authed) aside,body:not(.authed) #workspace,body:not(.authed) .bar{display:none}body:not(.authed) main{margin:auto;max-width:620px}body.authed .login-card{display:none}[hidden]{display:none!important}.project-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.danger{color:#ffa6a0}.image-preview{display:block;max-width:240px;max-height:130px;object-fit:contain;border-radius:8px;margin:10px 0} @media(max-width:800px){aside{position:static;width:auto;border-left:0;border-bottom:1px solid var(--line);padding:16px;gap:10px}aside footer{display:none}nav{display:flex;overflow-x:auto}nav button{white-space:nowrap;flex-shrink:0}main{margin:0;padding:20px 16px 120px}.bar{right:0;padding:12px 16px;flex-wrap:wrap}.grid{grid-template-columns:1fr;gap:12px}.grid>div+div{border:0;padding:0}section,article{padding:16px}h1{font-size:23px}.stats{grid-template-columns:1fr 1fr}.login-card{margin:5vh auto}}</style><aside><div class="brand"><span class="eyebrow">PORTFOLIO / CMS</span>مرکز مدیریت</div><nav aria-label="بخش‌های مدیریت" id="nav"></nav><footer>نسخه ۲.۱ آزمایشی<br><a href="/" target="_blank" rel="noopener">مشاهده سایت ↗</a></footer></aside><main><section class="login-card"><span class="eyebrow">SECURE ACCESS</span><h1>ورود به مرکز مدیریت</h1><p>مدیریت محتوای پورتفولیو</p><form id="loginForm"><label>رمز مدیر<input id="password" type="password" autocomplete="current-password" required></label><button id="login" class="primary" type="submit">ورود به داشبورد</button></form><p id="loginStatus" role="status"></p></section><div id="workspace"><header><div><span class="eyebrow">SABER / ADMIN</span><h1 id="pageTitle">داشبورد</h1><p id="pageDesc"></p></div><div class="actions"><a href="/" target="_blank" rel="noopener">نمایش سایت ↗</a><button id="logout">خروج</button></div></header><div id="editor"></div></div><div class="bar"><span id="status" role="status"></span><div class="actions"><button id="reload">بارگذاری مجدد</button><button id="save" class="primary" disabled>ذخیره تغییرات</button></div></div></main><script>
const $=q=>document.querySelector(q),root=$('#editor'),status=$('#status');let state={},baseline='',active=0,ready=false,busy=false;const pages=[['داشبورد','نمای کلی محتوا و وضعیت سایت'],['متن‌های سایت','ویرایش محتوای فارسی و انگلیسی'],['پروژه‌ها','مدیریت نمونه‌کارها، تصاویر و ترتیب نمایش'],['رنگ‌بندی','شخصی‌سازی هویت بصری سایت'],['SEO','عنوان و توضیحات موتورهای جستجو'],['تنظیمات نمایش','کنترل امکانات صفحه اصلی']];const defaults={texts:{en:{hero:'Digital.|By design.',tagline:'Digital tools that solve real problems.',kicker:'Design & digital development / 002',works:'01 / Selected works',contactTitle:"Let's connect.",contact:'Have a project in mind, a question, or an idea? Get in touch.',footer:'© 2026 Saber Vanaki.'},fa:{hero:'دیجیتال.|طراحی هدفمند.',tagline:'راهکارهای دیجیتال برای نیازهای واقعی.',kicker:'طراحی و توسعهٔ دیجیتال / ۰۰۲',works:'۰۱ / نمونه‌کارهای منتخب',contactTitle:'با من در ارتباط باشید.',contact:'برای همکاری، طرح ایده یا پرسش‌های خود پیام بفرستید.',footer:'© ۲۰۲۶ صابر ونکی'}},projects:[{template:0,url:'https://classer.sabervanaki.ir/',image:'',en:{title:'Classer.',description:'A smarter way to manage education.',category:'ED / TECH',side:'System 01 / Education'},fa:{title:'کلسر.',description:'مدیریت هوشمند کلاس‌ها و فرایند آموزش.',category:'فناوری آموزش',side:'پروژه ۰۱ / آموزش'}},{template:1,url:'https://melksanj.sabervanaki.ir/',image:'',en:{title:'Melksanj.',description:'Clarity in property calculations.',category:'PROP / TECH',side:'System 02 / Property'},fa:{title:'ملک‌سنج.',description:'محاسبات ملکی، ساده و شفاف.',category:'فناوری املاک',side:'پروژه ۰۲ / املاک'}}],settings:{motion:true,contactEnabled:true},theme:{bg:'#10110f',ink:'#f3f2e9',lime:'#d4ff24',line:'#45463e',muted:'#b4b5a9'},seo:{en:{title:'Saber Vanaki — Digital. By design.',description:'Saber Vanaki — selected digital experiences and independent design.'},fa:{title:'صابر ونکی — طراحی و توسعهٔ دیجیتال',description:'نمونه‌کارهای طراحی و توسعه دیجیتال'}}};
function node(tag,txt,parent){const e=document.createElement(tag);if(txt)e.textContent=txt;if(parent)parent.append(e);return e}function field(parent,obj,key,label,type='text'){const l=node('label',label,parent),e=node(type==='textarea'?'textarea':'input','',l);if(type!=='textarea')e.type=type;e.value=obj[key]??'';e.dir='auto';e.oninput=()=>{obj[key]=e.value;changed()};return e}function button(parent,label,fn){const b=node('button',label,parent);b.onclick=fn;return b}function section(label){const s=node('section','',root);node('h2',label,s);return s}function langs(parent,obj,fields){const g=node('div','',parent);g.className='grid';for(const lang of ['fa','en']){obj[lang]??={};const c=node('div','',g);node('h3',lang==='fa'?'فارسی':'English',c);for(const [k,v] of Object.entries(fields))field(c,obj[lang],k,v,k==='description'?'textarea':'text')}}
function render(){root.replaceChildren();const overview=section('نمای کلی');const stats=node('div','',overview);stats.className='stats';for(const [n,t] of [[state.projects.length,'پروژه'],[2,'زبان'],[state.settings.contactEnabled?'فعال':'غیرفعال','فرم تماس']]){const c=node('div','',stats);c.className='stat';node('strong',String(n),c);node('span',t,c)}node('p','از منوی مدیریت، بخش موردنظر را انتخاب و پس از ویرایش تغییرات را ذخیره کنید.',overview);langs(section('متن‌های سایت'),state.texts,{hero:'تیتر اصلی (با | برای خط دوم)',tagline:'زیرتیتر',kicker:'عنوان بالای تیتر',works:'عنوان پروژه‌ها',contactTitle:'عنوان تماس',contact:'توضیح تماس',footer:'فوتر'});const p=section('پروژه‌ها');state.projects.forEach((item,i)=>{const a=node('article','',p);node('h3','پروژه '+(i+1)+' — '+(item.fa?.title||item.en?.title||'بدون عنوان'),a);langs(a,item,{title:'نام',description:'توضیح',category:'دسته',side:'متن کنار کارت'});field(a,item,'url','لینک');const im=field(a,item,'image','آدرس تصویر یا تصویر بارگذاری‌شده');const file=node('input','',a);file.type='file';file.accept='image/png,image/jpeg,image/webp';file.onchange=()=>{const f=file.files[0];if(!f)return;if(f.size>500000){status.textContent='تصویر باید کمتر از ۵۰۰ کیلوبایت باشد.';return}const reader=new FileReader();reader.onload=()=>{item.image=reader.result;im.value=reader.result;changed();};reader.readAsDataURL(f)};const actions=node('div','',a);actions.className='actions';button(actions,'بالا',()=>{if(i){[state.projects[i-1],state.projects[i]]=[item,state.projects[i-1]];render()}});button(actions,'پایین',()=>{if(i+1<state.projects.length){[state.projects[i+1],state.projects[i]]=[item,state.projects[i+1]];render()}});button(actions,'حذف',()=>{if(confirm('این پروژه حذف شود؟')){state.projects.splice(i,1);render()}})});button(p,'افزودن پروژه',()=>{state.projects.push({template:0,url:'',image:'',fa:{},en:{}});render()});const theme=section('رنگ‌بندی');for(const k of Object.keys(defaults.theme))field(theme,state.theme,k,k,'color');langs(section('SEO'),state.seo,{title:'عنوان صفحه',description:'توضیحات صفحه'});const settings=section('تنظیمات نمایش');for(const [k,label] of [['motion','فعال بودن انیمیشن موج'],['contactEnabled','نمایش فرم تماس']]){const l=node('label',label,settings),i=node('input','',l);i.type='checkbox';i.checked=state.settings[k]!==false;i.onchange=()=>{state.settings[k]=i.checked;changed()};}navigate(active);changed();}
function navigate(i){active=i;[...root.children].forEach((e,j)=>e.hidden=j!==i);[...$('#nav').children].forEach((e,j)=>e.setAttribute('aria-current',j===i?'page':'false'));$('#pageTitle').textContent=pages[i][0];$('#pageDesc').textContent=pages[i][1];window.scrollTo(0,0)}
pages.forEach(([name],i)=>{const b=button($('#nav'),name,()=>navigate(i));const num=node('b',String(i+1).padStart(2,'0'));b.prepend(num)});
function dirty(){return ready&&JSON.stringify(state)!==baseline}function changed(){ $('#save').disabled=!dirty()||busy;if(dirty()&&!busy)status.textContent='تغییرات ذخیره نشده';}
function showLogin(msg){ready=false;document.body.classList.remove('authed');root.replaceChildren();$('#loginStatus').textContent=msg;$('#password').value='';}
async function request(url,opts={}){const r=await fetch(url,{cache:'no-store',...opts});const d=await r.json();if(!r.ok){const e=Error(d.error||'خطای ارتباط');e.status=r.status;throw e}return d}
async function load(){try{const session=await request('/api/session');if(!session.authenticated){showLogin('برای ادامه وارد شوید.');return}const d=await request('/api/content');state=structuredClone(defaults);for(const k of ['texts','seo'])for(const l of ['fa','en'])Object.assign(state[k][l],d[k]?.[l]||{});for(const k of ['theme','settings'])Object.assign(state[k],d[k]||{});if(Array.isArray(d.projects))state.projects=d.projects;baseline=JSON.stringify(state);ready=true;document.body.classList.add('authed');render();status.textContent='محتوا بارگذاری شد.'}catch(e){if(ready)status.textContent='بارگذاری ناموفق: '+e.message;else showLogin('ارتباط ناموفق: '+e.message)}}
$('#reload').onclick=()=>{if(!busy&&(!dirty()||confirm('تغییرات ذخیره نشده حذف شوند؟')))load()};
$('#save').onclick=async()=>{if(busy||!dirty())return;const payload=JSON.stringify(state);if(payload.length>1500000){status.textContent='حجم محتوا بیش از حد مجاز است.';return}busy=true;changed();status.textContent='در حال ذخیره…';try{await request('/api/content',{method:'PUT',headers:{'Content-Type':'application/json'},body:payload});baseline=payload;status.textContent=dirty()?'تغییرات جدید هنوز ذخیره نشده‌اند.':'تغییرات با موفقیت ذخیره شد.'}catch(e){status.textContent='ذخیره ناموفق: '+e.message+(e.status===401?' — نشست منقضی شده است؛ تغییرات را از دست ندهید.':'')}finally{busy=false;$('#save').disabled=!dirty()}};
$('#loginForm').onsubmit=async(e)=>{e.preventDefault();$('#login').disabled=true;$('#loginStatus').textContent='در حال ورود…';try{await request('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})});$('#password').value='';await load()}catch(e){$('#loginStatus').textContent='ورود ناموفق: '+e.message}finally{$('#login').disabled=false}};
$('#logout').onclick=async()=>{if(busy||dirty()&&!confirm('تغییرات ذخیره نشده‌اند. خارج شوید؟'))return;try{await request('/api/session',{method:'DELETE'});showLogin('از پنل خارج شدید.')}catch(e){status.textContent='خروج ناموفق: '+e.message}};
window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue=''}});load();
</script></html>
