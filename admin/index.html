<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>مدیریت پورتفولیو</title><style>:root{color-scheme:dark;--lime:#d4ff24}*{box-sizing:border-box}body{margin:0;background:#10110f;color:#f3f2e9;font:15px/1.8 Tahoma,Arial,sans-serif}main{max-width:1000px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:26px}h2{font-size:18px;color:var(--lime)}section,article{border:1px solid #45463e;border-radius:12px;padding:16px;margin:14px 0}label{display:grid;gap:5px;margin:8px 0;color:#c5c5bc}input,textarea,button,select{font:inherit;border:1px solid #45463e;border-radius:7px;padding:9px;background:#1b1c17;color:inherit;min-width:0}textarea{min-height:72px;resize:vertical}button{cursor:pointer}button.primary{background:var(--lime);color:#10110f;font-weight:bold}a{color:var(--lime)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}#status{white-space:pre-wrap;position:sticky;bottom:0;background:#10110f;padding:12px}input[type=color]{width:100%;height:48px}@media(max-width:640px){.grid{grid-template-columns:1fr}main{padding:12px}}</style><main><header><h1>مدیریت پورتفولیو <small>2.0.0</small></h1><a href="/">نمایش سایت</a></header><section><h2>دسترسی مدیر</h2><label>رمز مدیر<input id="password" type="password" autocomplete="current-password" placeholder="رمز تعریف شده در Cloudflare"></label><div class="actions"><button id="login" class="primary">ورود</button><button id="logout">خروج</button></div><p>نشست امن یک‌ساعته؛ رمز در مرورگر ذخیره نمی‌شود.</p></section><div id="editor"></div><div class="actions"><button id="save" class="primary" disabled>ذخیره تغییرات</button><button id="reload">بارگذاری مجدد</button></div><p id="status" role="status"></p></main><script>
const $=q=>document.querySelector(q),root=$('#editor'),status=$('#status');let state={};const defaults={texts:{en:{hero:'Digital.|By design.',tagline:'Digital tools that solve real problems.',kicker:'Design & digital development / 002',works:'01 / Selected works',contactTitle:"Let's connect.",contact:'Have a project in mind, a question, or an idea? Get in touch.',footer:'© 2026 Saber Vanaki.'},fa:{hero:'دیجیتال.|طراحی هدفمند.',tagline:'راهکارهای دیجیتال برای نیازهای واقعی.',kicker:'طراحی و توسعهٔ دیجیتال / ۰۰۲',works:'۰۱ / نمونه‌کارهای منتخب',contactTitle:'با من در ارتباط باشید.',contact:'برای همکاری، طرح ایده یا پرسش‌های خود پیام بفرستید.',footer:'© ۲۰۲۶ صابر ونکی'}},projects:[{template:0,url:'https://classer.sabervanaki.ir/',image:'',en:{title:'Classer.',description:'A smarter way to manage education.',category:'ED / TECH',side:'System 01 / Education'},fa:{title:'کلسر.',description:'مدیریت هوشمند کلاس‌ها و فرایند آموزش.',category:'فناوری آموزش',side:'پروژه ۰۱ / آموزش'}},{template:1,url:'https://melksanj.sabervanaki.ir/',image:'',en:{title:'Melksanj.',description:'Clarity in property calculations.',category:'PROP / TECH',side:'System 02 / Property'},fa:{title:'ملک‌سنج.',description:'محاسبات ملکی، ساده و شفاف.',category:'فناوری املاک',side:'پروژه ۰۲ / املاک'}}],settings:{motion:true,contactEnabled:true},theme:{bg:'#10110f',ink:'#f3f2e9',lime:'#d4ff24',line:'#45463e',muted:'#b4b5a9'},seo:{en:{title:'Saber Vanaki — Digital. By design.',description:'Saber Vanaki — selected digital experiences and independent design.'},fa:{title:'صابر ونکی — طراحی و توسعهٔ دیجیتال',description:'نمونه‌کارهای طراحی و توسعه دیجیتال'}}};
function node(tag,txt,parent){const e=document.createElement(tag);if(txt)e.textContent=txt;if(parent)parent.append(e);return e}function field(parent,obj,key,label,type='text'){const l=node('label',label,parent),e=node(type==='textarea'?'textarea':'input','',l);if(type!=='textarea')e.type=type;e.value=obj[key]??'';e.dir='auto';e.oninput=()=>obj[key]=e.value;return e}function button(parent,label,fn){const b=node('button',label,parent);b.onclick=fn;return b}function section(label){const s=node('section','',root);node('h2',label,s);return s}function langs(parent,obj,fields){const g=node('div','',parent);g.className='grid';for(const lang of ['fa','en']){obj[lang]??={};const c=node('div','',g);node('h3',lang==='fa'?'فارسی':'English',c);for(const [k,v] of Object.entries(fields))field(c,obj[lang],k,v,k==='description'?'textarea':'text')}}
function render(){root.replaceChildren();langs(section('متن‌های سایت'),state.texts,{hero:'تیتر اصلی (با | برای خط دوم)',tagline:'زیرتیتر',kicker:'عنوان بالای تیتر',works:'عنوان پروژه‌ها',contactTitle:'عنوان تماس',contact:'توضیح تماس',footer:'فوتر'});const p=section('پروژه‌ها');state.projects.forEach((item,i)=>{const a=node('article','',p);node('h3','پروژه '+(i+1),a);langs(a,item,{title:'نام',description:'توضیح',category:'دسته',side:'متن کنار کارت'});field(a,item,'url','لینک');const im=field(a,item,'image','آدرس تصویر یا تصویر بارگذاری‌شده');const file=node('input','',a);file.type='file';file.accept='image/png,image/jpeg,image/webp';file.onchange=()=>{const f=file.files[0];if(!f)return;if(f.size>500000){status.textContent='تصویر باید کمتر از ۵۰۰ کیلوبایت باشد.';return}const reader=new FileReader();reader.onload=()=>{item.image=reader.result;im.value=reader.result};reader.readAsDataURL(f)};const actions=node('div','',a);actions.className='actions';button(actions,'بالا',()=>{if(i){[state.projects[i-1],state.projects[i]]=[item,state.projects[i-1]];render()}});button(actions,'پایین',()=>{if(i+1<state.projects.length){[state.projects[i+1],state.projects[i]]=[item,state.projects[i+1]];render()}});button(actions,'حذف',()=>{if(confirm('این پروژه حذف شود؟')){state.projects.splice(i,1);render()}})});button(p,'افزودن پروژه',()=>{state.projects.push({template:0,url:'',image:'',fa:{},en:{}});render()});const theme=section('رنگ‌بندی');for(const k of Object.keys(defaults.theme))field(theme,state.theme,k,k,'color');langs(section('SEO'),state.seo,{title:'عنوان صفحه',description:'توضیحات صفحه'});const settings=section('تنظیمات نمایش');for(const [k,label] of [['motion','فعال بودن انیمیشن موج'],['contactEnabled','نمایش فرم تماس']]){const l=node('label',label,settings),i=node('input','',l);i.type='checkbox';i.checked=state.settings[k]!==false;i.onchange=()=>state.settings[k]=i.checked;}}
async function load(){try{$('#save').disabled=true;const session=await fetch('/api/session',{cache:'no-store'}).then(r=>r.json());if(!session.authenticated){root.replaceChildren();status.textContent='ابتدا وارد شوید.';return}const r=await fetch('/api/content',{cache:'no-store'});if(!r.ok)throw Error('DB/API unavailable');const d=await r.json();state={...structuredClone(defaults),...d};render();$('#save').disabled=false;status.textContent='محتوا بارگذاری شد.'}catch(e){status.textContent='اتصال API برقرار نیست؛ تنظیمات DB را بررسی کنید.'}}$('#reload').onclick=load;$('#save').onclick=async()=>{try{$('#save').disabled=true;const r=await fetch('/api/content',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});const d=await r.json();if(!r.ok)throw Error(d.error||'Save failed');status.textContent='تغییرات ذخیره شد.';$('#password').value=''}catch(e){status.textContent='ذخیره ناموفق: '+e.message}finally{$('#save').disabled=false}};$('#login').onclick=async()=>{try{const r=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})});const d=await r.json();if(!r.ok)throw Error(d.error);$('#password').value='';await load()}catch(e){status.textContent='ورود ناموفق: '+e.message}};$('#logout').onclick=async()=>{await fetch('/api/session',{method:'DELETE'});await load()};load();
</script></html>
